name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://astrum:astrum@localhost:5432/astrum?schema=public
  JWT_SECRET: ci-jwt-secret

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astrum
          POSTGRES_PASSWORD: astrum
          POSTGRES_DB: astrum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astrum -d astrum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate the Prisma client
        run: pnpm db:generate
      - name: Apply migrations
        run: pnpm prisma:migrate:deploy
      - name: Build the shared database client
        run: pnpm --filter @astrum/db build
      - name: Type check
        run: pnpm check-types
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Integration tests
        run: ORDER_DB_TESTS=1 pnpm --filter @astrum/api test:integration
