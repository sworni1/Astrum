services:
  astrum-db:
    image: postgres:16
    container_name: astrum-db
    ports:
      - 5432:5432
    env_file:
      - packages/Astrum-db/.env
    volumes:
      - astrum-db-data:/var/lib/postgresql/data
    networks:
      - astrumnetwork

  astrum-redis:
    image: redis:7-alpine
    container_name: astrum-redis
    # No persistence, the same as the production service: a restart ends every
    # live session on purpose.
    command: redis-server --save "" --appendonly no
    ports:
      - 6379:6379
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - astrumnetwork

  astrum-api:
    container_name: astrum-backend
    build:
      context: .
      dockerfile: apps/api-astrum/Dockerfile
    depends_on:
      astrum-db:
        condition: service_started
      astrum-auth:
        condition: service_started
      astrum-redis:
        condition: service_healthy
    ports:
      - 3580:3580
    env_file:
      - apps/api-astrum/.env.prod
    networks:
      - astrumnetwork

  astrum-auth:
    container_name: auth-service
    build:
      context: .
      dockerfile: apps/auth-astrum/Dockerfile
    depends_on:
      astrum-db:
        condition: service_started
      astrum-redis:
        condition: service_healthy
    ports:
      - 4580:4580
    env_file:
      - apps/auth-astrum/.env.prod
    networks:
      - astrumnetwork

  astrum-customer:
    container_name: frontend-astrum-customer
    build:
      context: .
      dockerfile: apps/customer/Dockerfile
    depends_on:
      - astrum-api
    ports:
      - 3000:3000
    env_file:
      - apps/customer/.env.production
    networks:
      - astrumnetwork

networks:
  astrumnetwork:
    external: true

volumes:
  astrum-db-data:
