services:
  astrum-db:
    image: postgres:16
    container_name: astrum-db
    ports:
      - 5432:5432
    env_file:
      - packages/Astrum-db/.env
    volumes:
      - astrum-db-data:/var/lib/postgresql/data
    networks:
      - astrumnetwork

  astrum-api:
    container_name: astrum-backend
    build:
      context: .
      dockerfile: apps/api-astrum/Dockerfile
    depends_on:
      - astrum-db
      - astrum-auth
      - astrum-sentiment
    ports:
      - 3580:3580
    env_file:
      - apps/api-astrum/.env.prod
    networks:
      - astrumnetwork

  astrum-auth:
    container_name: auth-service
    build:
      context: .
      dockerfile: apps/auth-astrum/Dockerfile
    depends_on:
      - astrum-db
    ports:
      - 4580:4580
    env_file:
      - apps/auth-astrum/.env.prod
    networks:
      - astrumnetwork

  astrum-customer:
    container_name: frontend-astrum-customer
    build:
      context: .
      dockerfile: apps/customer/Dockerfile
    depends_on:
      - astrum-api
    ports:
      - 3000:3000
    env_file:
      - apps/customer/.env.production
    networks:
      - astrumnetwork

  astrum-translate:
    container_name: astrum-translate
    build:
      context: ./apps/translate-astrum
      dockerfile: Dockerfile
    ports:
      - 3313:3313
    env_file:
      - apps/translate-astrum/.env
    networks:
      - astrumnetwork

  astrum-sentiment:
    container_name: astrum-sentiment
    build:
      context: .
      dockerfile: apps/sentiment-astrum/Dockerfile
    depends_on:
      - astrum-translate
    ports:
      - 8088:8088
    env_file:
      - apps/sentiment-astrum/.env
    environment:
      SENTIMENT_MODEL_DIR: /app/model
    volumes:
      - astrum-sentiment-model:/app/model
    networks:
      - astrumnetwork

networks:
  astrumnetwork:
    external: true

volumes:
  astrum-db-data:
  astrum-sentiment-model:
