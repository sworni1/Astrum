services:
  astrum-db:
    image: postgres:13
    container_name: astrum-db
    ports:
      - 5432:5432
    env_file:
      - packages/Astrum-db/.env
    networks:
      - astrumnetwork

  astrum-api:
    container_name: astrum-backend
    build:
      context: .
      dockerfile: apps/api-astrum/Dockerfile
    ports:
      - 3580:3580
    env_file:
      - apps/api-astrum/.env.prod
    networks:
      - astrumnetwork

  astrum-auth:
    container_name: auth-service
    build:
      context: .
      dockerfile: apps/auth-astrum/Dockerfile
    ports:
      - 4580:4580
    env_file:
      - apps/auth-astrum/.env.prod
    networks:
      - astrumnetwork

  astrum-customer:
    container_name: frontend-astrum-customer
    build:
      context: .
      dockerfile: apps/customer/Dockerfile
      args:
        API_GATEWAY_INTERNAL_URL: http://astrum-api:3580
    ports:
      - 3000:3000
    env_file:
      - apps/customer/.env.production
    networks:
      - astrumnetwork

  astrum-translate:
    container_name: astrum-translate
    build:
      context: ./apps/translate-astrum
      dockerfile: Dockerfile
    ports:
      - 3313:3313
    env_file:
      - apps/translate-astrum/.env
    networks:
      - astrumnetwork

networks:
  astrumnetwork:
    external: true
